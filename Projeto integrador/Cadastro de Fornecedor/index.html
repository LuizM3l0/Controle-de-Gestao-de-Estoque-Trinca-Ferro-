<!DOCTYPE html>
<html lang="port">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Fornecedor</title>
</head>
<body>
    <h2>Cadastro de Fornecedor</h2>

    <form>

    <label for="nome-empresa">Nome da Empresa(obrigatório):</label>
    <input type="text" id="nome-empresa" name="nome-empresa" placeholder="Insira o nome da empresa" required>

<br><br>

    <label for="cnpj">CNPJ (obrigatório):</label>
    <input type="text" id="cnpj" name="cnpj"
           placeholder="00.000.000/0000-00"
           required maxlength="18">

           <br><br>

    <label for="nome-endereço">Endereço(obrigatório):</label>
    <input type="text" id="nome-endereço" name="nome-endereço" placeholder="Insira o endereço" required>

           <br><br>
           
    <label for="telefone">Telefone (obrigatório):</label>
    <input type="text" id="telefone" name="telefone"
           placeholder="(00) 0000-0000" 
           required maxlength="15">
    
           <br><br>

    <label for="email">E-mail (obrigatório):</label>
    <input type="email" id="email" name="email"
           placeholder="exemplo@fornecedor.com" required>
       
           <br><br>
       
           <button type="submit">Cadastrar</button>

    </form>

  <!-- Importa o arquivo JavaScript -->
  <script src="script.js"></script>

</body>
</html>
